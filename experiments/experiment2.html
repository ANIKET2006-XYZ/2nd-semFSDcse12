<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StyleVibe - Fashion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">StyleVibe</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <h1 class="text-center mb-4">Our Fashion Collection</h1>

    <div class="row">

      <!-- Card 1 -->
      <div class="col-lg-4 col-md-6 mb-4">
        <div class="card">
          <img src="https://i5.walmartimages.com/seo/YANHAIGONG-Spring-Saving-Cropped-Denim-Jackets-Cardigans-For-Women-Womens-Short-Sleeve-Jacket-Summer-Classic-Lapel-Button-Down-Cropped-Trucker-Jean-C_fdd9c57c-bacd-402e-9c55-1d5a42c5ab62.5b71605fdd46997dfa33191da245b441.jpeg" class="card-img-top" alt="Jacket">
          <div class="card-body">
            <span class="badge bg-primary">New</span>
            <h5 class="card-title mt-2">Denim Jacket</h5>
            <p class="card-text">Comfortable slim fit denim jacket.</p>
            <h5 class="text-success">₹1499</h5>
            <button class="btn btn-dark w-100" data-bs-toggle="modal" data-bs-target="#myModal"
              data-name="Denim Jacket" data-price="₹1499" data-desc="Stylish and durable denim jacket for all seasons.">
              View Details
            </button>
          </div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="col-lg-4 col-md-6 mb-4">
        <div class="card">
          <img src="https://www.moderngentlemanmagazine.com/wp-content/uploads/2024/04/Breezy-Linen-Elegance-Casual-Outfit-for-Summer-650x808.jpg" class="card-img-top" alt="Dress">
          <div class="card-body">
            <span class="badge bg-danger">Sale</span>
            <h5 class="card-title mt-2">Summer Dress</h5>
            <p class="card-text">Beautiful floral printed dress.</p>
            <h5 class="text-success">₹899</h5>
            <button class="btn btn-dark w-100" data-bs-toggle="modal" data-bs-target="#myModal"
              data-name="Summer Dress" data-price="₹899" data-desc="Light and comfortable summer dress.">
              View Details
            </button>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="col-lg-4 col-md-6 mb-4">
        <div class="card">
          <img src="https://images.puma.com/image/upload/f_auto,q_auto,b_rgb:fafafa,w_750,h_750/global/394371/03/sv01/fnd/IND/fmt/png/Smashic-Comfort-Casual-Sneakers" class="card-img-top" alt="Shoes">
          <div class="card-body">
            <span class="badge bg-primary">New</span>
            <h5 class="card-title mt-2">Casual Shoes</h5>
            <p class="card-text">Trendy and comfortable shoes.</p>
            <h5 class="text-success">₹1299</h5>
            <button class="btn btn-dark w-100" data-bs-toggle="modal" data-bs-target="#myModal"
              data-name="Casual Shoes" data-price="₹1299" data-desc="Stylish casual shoes for daily wear.">
              View Details
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Simple Modal -->
  <div class="modal fade" id="myModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <img id="modalImg" src="" class="img-fluid mb-3" alt="">
          <h5 id="modalPrice"></h5>
          <p id="modalDesc"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2026 StyleVibe Fashion Store</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const modal = document.getElementById('myModal');
    modal.addEventListener('show.bs.modal', function(e) {
      const btn = e.relatedTarget;
      document.getElementById('modalTitle').innerText = btn.getAttribute('data-name');
      document.getElementById('modalPrice').innerText = btn.getAttribute('data-price');
      document.getElementById('modalDesc').innerText = btn.getAttribute('data-desc');
      document.getElementById('modalImg').src = btn.parentElement.parentElement.querySelector('img').src;
    });
  </script>
</body>
</html>
