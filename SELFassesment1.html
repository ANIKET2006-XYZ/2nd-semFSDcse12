<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Academic Details</title>
</head>
<body>
 <h1 align="center">Student Registeration Form</h1>

 <label for="fullname">Full Name</label>
  <input type="text" name="fullname" id="fullname" placeholder="Enter your full name " required>

  
 <label for="rollno">Roll No</label>
  <input type="number" id="rollno" placeholder="Enter your rollno" required>

  <label for="math">Math</label>
  <input type="number" id="math" placeholder="Enter your marks" required>

<label for="science">Science</label>
  <input type="number" id="science" placeholder="Enter your marks" required>

  <label for="enlish">English</label>
  <input type="number" id="english" placeholder="Enter your marks" required>

 <button onclick="totalstudents()">Total Students</button>
 

 
</body>
</html>
