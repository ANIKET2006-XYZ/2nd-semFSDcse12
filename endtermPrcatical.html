<!DOCTYPE html>
<html>
<head>
    <title>Even Odd Checker</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }
        input, button {
            padding: 10px;
            margin: 10px;
        }
        #result {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Even Odd Checker</h1>

    <input type="number" id="num" placeholder="Enter Number">
    <button onclick="checkNumber()">Check</button>

    <p id="result"></p>

    <script>
        function checkNumber() {
            let num = document.getElementById("num").value;

            if (num % 2 == 0) {
                document.getElementById("result").innerHTML = "Even Number";
            } else {
                document.getElementById("result").innerHTML = "Odd Number";
            }
        }
    </script>

</body>
</html>
